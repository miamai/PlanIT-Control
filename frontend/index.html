<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/planit-favicon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/images/planit-icon.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/apple-touch-icon.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>PlanIT Control</title>
    <meta name="title" content="PlanIT Control" />
    <meta
      name="description"
      content="Real-time environmental hazard platform for utility field crews."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://planit.control" />
    <meta property="og:title" content="PlanIT Control" />
    <meta
      property="og:description"
      content="Real-time environmental hazard platform for utility field crews."
    />
    <meta property="og:image" content="/images/planit-icon.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://planit.control" />
    <meta property="twitter:title" content="PlanIT Control" />
    <meta
      property="twitter:description"
      content="Real-time environmental hazard platform for utility field crews."
    />
    <meta property="twitter:image" content="/images/planit-icon.png" />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#fff" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
